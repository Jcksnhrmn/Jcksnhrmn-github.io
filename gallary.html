    <header class="page-header">
      <h1>Gallery</h1>

        <img src="images/sample-1.jpg" alt="Sunlight reflecting on glass facade" />

      </figure>
      <figure class="gallery-item">
        <img src="images/sample-2.jpg" alt="Close-up of textured concrete wall" />
        <figcaption>Sample 2</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/sample-3.jpg" alt="Minimalist interior with wooden chair" />
        <figcaption>Sample 3</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/sample-4.jpg" alt="Blue sky framed by geometric building" />

      </figure>
      <figure class="gallery-item">
        <img src="images/sample-5.jpg" alt="Shadow pattern across tiled floor" />
        <figcaption>Sample 5</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/sample-6.jpg" alt="Green plant by bright window" />
        <figcaption>Sample 6</figcaption>
      </figure>
    </section>
  </main>

  <footer class="site-footer">
